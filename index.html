<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>สตึก PATROL</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg:      #0b0e15;
      --surf:    #111620;
      --surf2:   #171d2a;
      --border:  #1e2840;
      --fg:      #dde8f5;
      --muted:   #4e6480;
      --accent:  #3b82f6;
      --ok:      #22d3a0;
      --warn:    #f05252;
      --gold:    #f59e0b;
      --e1:#38bdf8; --e2:#c084fc; --e3:#22d3a0; --r20:#f59e0b; --tr:#fb923c;
      --font: 'Kanit', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:var(--bg); }
    body { font-family:var(--font); color:var(--fg); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }

    /* ── DEVICE WRAP (desktop preview) ── */
    .device-wrap { display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:32px 20px; background:#070a10; }
    .device-frame { width:390px; min-height:844px; background:#000; border-radius:52px; padding:11px; box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07); flex-shrink:0; }
    .screen { width:100%; height:820px; background:var(--bg); border-radius:42px; overflow:hidden; display:flex; flex-direction:column; }

    @media(max-width:430px){
      .device-wrap { padding:0; background:var(--bg); }
      .device-frame { width:100%; border-radius:0; padding:0; box-shadow:none; min-height:100vh; }
      .screen { border-radius:0; height:100dvh; }
    }

    /* ── STATUS BAR ── */
    .status-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:13px 22px 6px; flex-shrink:0;
    }
    .status-clock { font-family:var(--mono); font-size:15px; font-weight:600; }
    .dynamic-island { width:110px; height:32px; background:#000; border-radius:18px; position:absolute; top:9px; left:50%; transform:translateX(-50%); }
    .status-right { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
    .live-dot { width:6px; height:6px; border-radius:50%; background:var(--ok); animation:blink 1.8s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── HEADER ── */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 20px 10px; flex-shrink:0;
      border-bottom:1px solid var(--border);
      background:var(--surf);
    }
    .header-brand { display:flex; align-items:baseline; gap:6px; }
    .brand-th { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:.04em; }
    .brand-en { font-size:22px; font-weight:400; letter-spacing:.06em; color:var(--fg); line-height:1; }
    .brand-en span { color:var(--accent); font-weight:700; }
    .header-right { display:flex; align-items:center; gap:8px; }
    .cd-wrap { position:relative; width:28px; height:28px; cursor:pointer; }
    .cd-wrap svg { position:absolute; top:0; left:0; }
    .cd-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:7.5px; color:var(--muted); }
    .refresh-btn { background:var(--surf2); border:1px solid var(--border); color:var(--fg); border-radius:8px; padding:5px 10px; font-family:var(--font); font-size:12px; cursor:pointer; }

    /* ── ALERT ── */
    .alert-bar {
      display:flex; align-items:center; gap:10px;
      padding:9px 18px; flex-shrink:0;
      background:#1a0e0e; border-bottom:1px solid #3d1515;
    }
    .alert-bar.hidden { display:none; }
    .alert-icon { font-size:16px; flex-shrink:0; }
    .alert-lbl { font-size:9px; color:var(--warn); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
    .alert-txt { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── STATS ── */
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-bottom:1px solid var(--border); flex-shrink:0; }
    .stat { background:var(--surf); padding:12px 10px; text-align:center; }
    .stat-val { font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:-.02em; }
    .stat-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; font-weight:500; }

    /* ── CONTENT PAGES ── */
    .page { flex:1; overflow:hidden; display:none; flex-direction:column; }
    .page.active { display:flex; }
    .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .scroll::-webkit-scrollbar { width:3px; }
    .scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .sec-hdr {
      padding:14px 18px 9px; font-size:10px; color:var(--muted);
      text-transform:uppercase; letter-spacing:.07em; font-weight:700;
      background:var(--bg); position:sticky; top:0; z-index:5;
      display:flex; justify-content:space-between; align-items:center;
    }
    .sec-badge { font-family:var(--mono); font-size:10px; color:var(--accent); background:rgba(59,130,246,.12); padding:2px 8px; border-radius:10px; }

    /* ── REPORT CARD ── */
    .rcard {
      background:var(--surf); padding:13px 18px;
      border-bottom:1px solid var(--border);
      display:flex; gap:12px; cursor:pointer; transition:background .1s;
    }
    .rcard:hover { background:var(--surf2); }
    .rbar { width:3px; border-radius:2px; flex-shrink:0; background:var(--ok); }
    .rcard.warn .rbar { background:var(--warn); }
    .rbody { flex:1; min-width:0; }
    .rtop { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .rzone { font-size:15px; font-weight:600; letter-spacing:-.01em; line-height:1.3; }
    .rtime { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; flex-shrink:0; }
    .rplace { font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:4px; }
    .rmeta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .pbadge { padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; font-family:var(--mono); }
    .sbadge { padding:2px 7px; border-radius:4px; font-size:10px; font-weight:600; }
    .s-ok   { background:rgba(34,211,160,.1); color:var(--ok); }
    .s-warn { background:rgba(240,82,82,.1);  color:var(--warn); }
    .rnote  { font-size:10px; color:var(--muted); }

    /* ── GPS LIST ── */
    .gitem { background:var(--surf); padding:11px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    .gdot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .gbody { flex:1; min-width:0; }
    .gzone { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gcoord { font-family:var(--mono); font-size:9.5px; color:var(--muted); margin-top:2px; }
    .gtime { font-family:var(--mono); font-size:10px; color:var(--muted); text-align:right; white-space:nowrap; line-height:1.6; }

    /* ── MAP ── */
    #map { width:100%; flex:1; background:#0a0f1a; }
    .leaflet-tile-pane { filter:brightness(.85); }
    .map-toggle {
      position:absolute; top:10px; right:10px; z-index:500;
      display:flex; background:rgba(11,14,21,.88); border:1px solid var(--border);
      border-radius:8px; overflow:hidden; backdrop-filter:blur(8px);
    }
    .map-toggle button {
      padding:6px 12px; background:transparent; border:none;
      color:var(--muted); font-family:var(--font); font-size:11px; cursor:pointer; transition:.15s;
    }
    .map-toggle button.on { background:var(--accent); color:#fff; }
    .map-wrap { flex:1; position:relative; display:flex; flex-direction:column; }

    /* ── STATS CHART ── */
    .chart-section { padding:12px; display:flex; flex-direction:column; gap:10px; }
    .ccard { background:var(--surf); border:1px solid var(--border); border-radius:10px; padding:14px; }
    .ctitle { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:10px; }
    .brow { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
    .blbl { width:54px; text-align:right; font-size:10px; color:var(--muted); flex-shrink:0; font-weight:500; }
    .bbg { flex:1; height:11px; background:var(--border); border-radius:3px; overflow:hidden; }
    .bfill { height:100%; border-radius:3px; transition:width .7s ease; }
    .bval { width:22px; font-family:var(--mono); font-size:10px; color:var(--fg); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      height:80px; background:var(--surf); border-top:1px solid var(--border);
      display:flex; align-items:flex-start; justify-content:space-around;
      padding:8px 4px 20px; flex-shrink:0;
    }
    .nav-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:5px 8px; min-width:52px; border:none; background:transparent;
      color:var(--muted); font-family:var(--font); cursor:pointer; border-radius:8px;
      transition:color .15s; -webkit-tap-highlight-color:transparent;
    }
    .nav-btn.on { color:var(--accent); }
    .nav-icon { font-size:20px; line-height:1; }
    .nav-lbl { font-size:10px; font-weight:500; }

    /* ── EMPTY ── */
    .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; }
    .empty-icon { font-size:36px; margin-bottom:10px; }

    /* ── TOAST & LOADBAR ── */
    #lbar { position:fixed; top:0; left:0; height:2px; width:0%; z-index:9999; background:linear-gradient(90deg,var(--accent),var(--ok)); transition:width .4s; }
    #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surf2); border:1px solid var(--border); border-radius:8px; padding:7px 16px; font-size:12px; z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
    #toast.on { opacity:1; }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper { background:var(--surf); border:1px solid var(--border); border-radius:8px; color:var(--fg); font-family:var(--font); box-shadow:0 8px 30px rgba(0,0,0,.5); }
    .leaflet-popup-tip { background:var(--surf); }
    .leaflet-popup-content { margin:10px 12px; font-size:12px; line-height:1.6; }
    .pop-zone { font-weight:700; font-size:13px; }
    .pop-detail { font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
<div id="lbar"></div>
<div id="toast"></div>

<div class="device-wrap">
<div class="device-frame">
<div class="screen">

  <!-- Status bar -->
  <div class="status-bar" style="position:relative">
    <div class="status-clock" id="clock">00:00</div>
    <div class="dynamic-island"></div>
    <div class="status-right">
      <span id="sync-lbl">Live</span>
      <div class="live-dot"></div>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div>
        <div class="brand-th">สภ.สตึก · จ.บุรีรัมย์</div>
        <div class="brand-en">สตึก <span>PATROL</span></div>
      </div>
    </div>
    <div class="header-right">
      <!-- countdown ring -->
      <div class="cd-wrap" onclick="doRefresh()" title="รีเฟรช">
        <svg width="28" height="28">
          <circle cx="14" cy="14" r="11" fill="none" stroke="var(--border)" stroke-width="2.5"/>
          <circle id="cd-ring" cx="14" cy="14" r="11" fill="none"
            stroke="var(--accent)" stroke-width="2.5"
            stroke-dasharray="69.1" stroke-dashoffset="0"
            stroke-linecap="round" transform="rotate(-90 14 14)"
            style="transition:stroke-dashoffset .9s linear"/>
        </svg>
        <div class="cd-num" id="cd-txt"></div>
      </div>
      <button class="refresh-btn" onclick="doRefresh()">⟳</button>
    </div>
  </div>

  <!-- Alert -->
  <div class="alert-bar hidden" id="alert-bar">
    <div class="alert-icon">⚠️</div>
    <div style="min-width:0">
      <div class="alert-lbl">รายงานผิดปกติ</div>
      <div class="alert-txt" id="alert-txt">—</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="s-tot" style="color:var(--accent)">—</div><div class="stat-lbl">รายงาน</div></div>
    <div class="stat"><div class="stat-val" id="s-ok"  style="color:var(--ok)">—</div><div class="stat-lbl">ปกติ</div></div>
    <div class="stat"><div class="stat-val" id="s-warn"style="color:var(--warn)">—</div><div class="stat-lbl">ผิดปกติ</div></div>
  </div>

  <!-- PAGES -->

  <!-- PAGE: รายงาน -->
  <div class="page active" id="page-report">
    <div class="scroll">
      <div class="sec-hdr"><span>ผลัดนี้ (08:00 น. — ตอนนี้)</span><span class="sec-badge" id="r-count">0</span></div>
      <div id="report-list"><div class="empty"><div class="empty-icon">📡</div>กำลังโหลด...</div></div>
    </div>
  </div>

  <!-- PAGE: แผนที่ -->
  <div class="page" id="page-map">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-toggle">
        <button            id="btn-street"    onclick="setLayer('street',this)">สี</button>
        <button class="on" id="btn-dark"      onclick="setLayer('dark',this)">มืด</button>
        <button            id="btn-satellite" onclick="setLayer('satellite',this)">🛰</button>
        <button            id="btn-topo"      onclick="setLayer('topo',this)">ภูมิ</button>
      </div>
    </div>
  </div>

  <!-- PAGE: GPS -->
  <div class="page" id="page-gps">
    <div class="scroll">
      <div class="sec-hdr"><span>พิกัด GPS</span><span class="sec-badge" id="g-count">0</span></div>
      <div id="gps-list"><div class="empty"><div class="empty-icon">🛰️</div>ไม่มีพิกัด GPS</div></div>
    </div>
  </div>

  <!-- PAGE: สถิติ -->
  <div class="page" id="page-stats">
    <div class="scroll">
      <div class="chart-section">
        <div class="ccard"><div class="ctitle">รายประเภทสายตรวจ</div><div id="c-patrol"></div></div>
        <div class="ccard"><div class="ctitle">สถานการณ์รวม</div><div id="c-summary"></div></div>
      </div>
    </div>
  </div>

  <!-- PAGE: วิเคราะห์ -->
  <div class="page" id="page-analysis">
    <div class="scroll">
      <div class="sec-hdr">
        <span>วิเคราะห์รายผลัด</span>
        <span class="sec-badge" id="an-count">0 ผลัด</span>
      </div>
      <div id="analysis-content" style="padding:10px;display:flex;flex-direction:column;gap:10px">
        <div class="empty"><div class="empty-icon">📈</div>กำลังโหลด...</div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-btn on" onclick="goPage('report',this)"><div class="nav-icon">📋</div><div class="nav-lbl">รายงาน</div></button>
    <button class="nav-btn"    onclick="goPage('map',this)"><div class="nav-icon">🗺️</div><div class="nav-lbl">แผนที่</div></button>
    <button class="nav-btn"    onclick="goPage('stats',this)"><div class="nav-icon">📊</div><div class="nav-lbl">สถิติ</div></button>
    <button class="nav-btn"    onclick="goPage('analysis',this)"><div class="nav-icon">🔍</div><div class="nav-lbl">วิเคราะห์</div></button>
  </div>

</div></div></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const SHEET_ID  = '1wedkPecV1Pnw_jR43nOtMzAAn4rPr1PPHOCgoT5f6fo';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
const REFRESH_S = 90;
const CENTER    = [15.291, 103.284];

// ══════════════════════════════════════════
// MAP SETUP
// ══════════════════════════════════════════
const map = L.map('map', { center:CENTER, zoom:15, zoomControl:true, attributionControl:false });

const LAYERS = {
  street:    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, subdomains:'abc', crossOrigin:true }),
  dark:      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, subdomains:'abc', crossOrigin:true }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, crossOrigin:true }),
  topo:      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, subdomains:'abc', crossOrigin:true }),
};
LAYERS.dark.addTo(map);
let currentLayer = 'dark';

const LAYER_FILTER = {
  street:    'none',
  dark:      'invert(1) hue-rotate(180deg) brightness(1.1) contrast(1.2) saturate(0.8)',
  satellite: 'none',
  topo:      'sepia(0.3) brightness(0.9) contrast(1.1)',
};

function setLayer(name, btn) {
  map.removeLayer(LAYERS[currentLayer]);
  LAYERS[name].addTo(map);
  currentLayer = name;
  ['street','dark','satellite','topo'].forEach(k => {
    const el = document.getElementById('btn-' + k);
    if (el) el.classList.toggle('on', k === name);
  });
  document.querySelector('.leaflet-tile-pane').style.filter = LAYER_FILTER[name] || 'none';
}

setTimeout(() => map.invalidateSize(), 500);

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let rows = [], markers = [], cdLeft = REFRESH_S, cdTimer = null;

// ══════════════════════════════════════════
// FETCH
// ══════════════════════════════════════════
async function loadSheet() {
  bar(20); lbl('โหลด...');
  try {
    const txt = await fetch(SHEET_URL + '&_=' + Date.now()).then(r => r.text());
    bar(70);
    rows = parseCSV(txt);
    bar(100); lbl('Live');
    render();
    toast(`✓ ${rows.length} รายการ`);
  } catch(e) {
    bar(0); lbl('ออฟไลน์');
    toast('⚠ โหลดไม่ได้');
  }
  resetCD();
}

function parseCSV(txt) {
  const lines = txt.trim().split('\n');
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const c = splitCSV(lines[i]);
    if (c.length < 3) continue;
    const lat = parseFloat(c[8] || ''), lng = parseFloat(c[9] || '');
    out.push({
      date: cl(c[0]), time: cl(c[1]), patrol: cl(c[2]),
      zone: cl(c[3]), zoneName: cl(c[4]), places: cl(c[5]),
      status: cl(c[6]), note: cl(c[7]),
      lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng,
      hasGPS: !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0,
    });
  }
  return out.reverse();
}
function cl(s='') { return (s||'').replace(/^"|"$/g,'').trim(); }
function splitCSV(line) {
  const r=[];let f='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){q=!q;}else if(c===','&&!q){r.push(f);f='';}else{f+=c;}}
  r.push(f);return r;
}

// ══════════════════════════════════════════
// FILTER — วันนี้ 08:00 ถึงตอนนี้
// ══════════════════════════════════════════
function getTodayShiftStart() {
  const now = new Date();
  const shift = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0);
  // ถ้าตอนนี้ก่อน 08:00 → shift เริ่มเมื่อวาน 08:00
  if (now < shift) shift.setDate(shift.getDate() - 1);
  return shift;
}

function parseRowDate(dateStr, timeStr) {
  try {
    const months = {'ม.ค.':0,'ก.พ.':1,'มี.ค.':2,'เม.ย.':3,'พ.ค.':4,'มิ.ย.':5,'ก.ค.':6,'ส.ค.':7,'ก.ย.':8,'ต.ค.':9,'พ.ย.':10,'ธ.ค.':11};
    const m = String(dateStr).match(/(\d+)\s+(\S+)\s+(\d+)/);
    if (!m) return null;
    let y = parseInt(m[3]);
    // "69" → 2569 พ.ศ. → 2026 ค.ศ.
    // "2569" → 2026 ค.ศ.
    // "2026" → ใช้ตรง
    if (y < 100) y += 2500;       // 69 → 2569
    if (y > 2400) y -= 543;       // 2569 → 2026
    const mo = months[m[2]];
    const d  = parseInt(m[1]);
    if (mo === undefined || isNaN(d) || isNaN(y)) return null;
    const tm = String(timeStr).match(/(\d+)[.:](\d+)/);
    const hr  = tm ? parseInt(tm[1]) : 0;
    const min = tm ? parseInt(tm[2]) : 0;
    return new Date(y, mo, d, hr, min, 0);
  } catch(e) { return null; }
}

function todayRows() {
  const start = getTodayShiftStart();
  return rows.filter(r => {
    const dt = parseRowDate(r.date, r.time);
    return dt && dt >= start;
  });
}

// COLORS
// ══════════════════════════════════════════
function pc(p='') {
  if(p.includes('เขตที่ 1')||p.includes('เขต 1'))return'#38bdf8';
  if(p.includes('เขตที่ 2')||p.includes('เขต 2'))return'#c084fc';
  if(p.includes('เขตที่ 3')||p.includes('เขต 3'))return'#22d3a0';
  if(p.includes('ร้อยเวร')||p.includes('20'))return'#f59e0b';
  if(p.includes('จราจร'))return'#fb923c';
  return'#6b7280';
}
function ps(p='') {
  if(p.includes('เขตที่ 1')||p.includes('เขต 1'))return'เขต 1';
  if(p.includes('เขตที่ 2')||p.includes('เขต 2'))return'เขต 2';
  if(p.includes('เขตที่ 3')||p.includes('เขต 3'))return'เขต 3';
  if(p.includes('ร้อยเวร')||p.includes('20'))return'ร้อยเวร';
  if(p.includes('จราจร'))return'จราจร';
  return p.slice(0,5)||'—';
}

  el.innerHTML = data.slice(0, 80).map(r => {
    const isW = r.status && r.status.includes('ผิดปกติ');
    const c = pc(r.patrol);
    const zone = r.zoneName || r.zone || r.places || '—';
    return `<div class="rcard ${isW?'warn':''}">

      <div class="rbody">
        <div class="rtop">

function renderMap(data) {
  data = data || rows;
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const gps = data.filter(r => r.hasGPS);
  if (!gps.length) return;

  gps.forEach(r => {
    const isW = r.status && r.status.includes('ผิดปกติ');
    const c = pc(r.patrol);
    const border = isW ? '#f05252' : '#22d3a0';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:13px;height:13px;border-radius:50%;background:${c};border:2.5px solid ${border};box-shadow:0 0 8px ${c}88;cursor:pointer"></div>`,
      iconAnchor: [6,6]
    });
    const mk = L.marker([r.lat, r.lng], { icon });
    mk.bindPopup(`
      <div style="min-width:180px">
        <div class="pop-zone" style="color:${c};font-size:13px;font-weight:700;margin-bottom:4px">${r.zoneName||r.zone||'—'}</div>

          🗺 เปิดใน Google Maps

  });

  // (zoom to fit เฉพาะเมื่อผู้ใช้กดปุ่มในอนาคต)
}

function renderGPS(data) {

function renderStats() {
  const byP = {};
  rows.forEach(r => {
    const k = ps(r.patrol) || 'อื่นๆ';
    if (!byP[k]) byP[k] = { n:0, c:pc(r.patrol) };
    byP[k].n++;
  });
  const maxN = Math.max(...Object.values(byP).map(v => v.n), 1);
  document.getElementById('c-patrol').innerHTML = Object.entries(byP).map(([k,v]) => `
    <div class="brow">
      <div class="blbl" style="color:${v.c}">${k}</div>
      <div class="bbg"><div class="bfill" style="width:${Math.round(v.n/maxN*100)}%;background:${v.c}99"></div></div>
      <div class="bval">${v.n}</div>
    </div>`).join('');

  const ok   = rows.filter(r => !r.status.includes('ผิดปกติ')).length;
  const warn = rows.filter(r =>  r.status.includes('ผิดปกติ')).length;
  const gps  = rows.filter(r => r.hasGPS).length;
  const tot  = Math.max(rows.length, 1);
  document.getElementById('c-summary').innerHTML = `
    <div class="brow"><div class="blbl" style="color:#22d3a0">ปกติ</div><div class="bbg"><div class="bfill" style="width:${Math.round(ok/tot*100)}%;background:#22d3a0"></div></div><div class="bval">${ok}</div></div>
    <div class="brow"><div class="blbl" style="color:#f05252">ผิดปกติ</div><div class="bbg"><div class="bfill" style="width:${Math.round(warn/tot*100)}%;background:#f05252"></div></div><div class="bval">${warn}</div></div>
    <div class="brow"><div class="blbl" style="color:#38bdf8">มี GPS</div><div class="bbg"><div class="bfill" style="width:${Math.round(gps/tot*100)}%;background:#38bdf888"></div></div><div class="bval">${gps}</div></div>`;
}

const SHEET2_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet2`;
let summaryRows = [];

async function loadAnalysis() {
  try {
    const txt = await fetch(SHEET2_URL + '&_=' + Date.now()).then(r => r.text());
    summaryRows = parseSheet2(txt);
    renderAnalysis();
  } catch(e) {
    document.getElementById('analysis-content').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div>โหลดข้อมูลไม่ได้<br><small>ตรวจสอบการเชื่อมต่อ</small></div>';
  }
}

function parseSheet2(txt) {
  const lines = txt.trim().split('\n');
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const c = splitCSV(lines[i]);
    if (c.length < 5) continue;
    out.push({
      date:      cl(c[0]),
      shift:     cl(c[1]),
      total:     parseInt(cl(c[2]))||0,
      e1:        parseInt(cl(c[3]))||0,
      e2:        parseInt(cl(c[4]))||0,
      e3:        parseInt(cl(c[5]))||0,
      r20:       parseInt(cl(c[6]))||0,
      traffic:   parseInt(cl(c[7]))||0,
      warn:      parseInt(cl(c[8]))||0,
      gps:       parseInt(cl(c[9]))||0,
      topZone:   cl(c[10]),
      lowZone:   cl(c[11]),
      peakHour:  cl(c[12]),
    });
  }
  return out.reverse(); // ล่าสุดก่อน
}

function renderAnalysis() {
  const el = document.getElementById('analysis-content');
  const n  = summaryRows.length;
  document.getElementById('an-count').textContent = n + ' ผลัด';

  const today = todayRows();
  const pColors = {'เขต 1':'#38bdf8','เขต 2':'#c084fc','เขต 3':'#22d3a0','ร้อยเวร':'#f59e0b','จราจร':'#fb923c'};

  // ── ส่วนที่ 1: ผลัดนี้ (real-time จาก Sheet1) ──
  const todayByPatrol = {};
  const todayByZone = {1:{},2:{},3:{}};
  today.forEach(r => {
    const k = ps(r.patrol);
    todayByPatrol[k] = (todayByPatrol[k]||0) + 1;
    // นับโซน
    const grp = r.patrol.includes('เขต 1')||r.patrol.includes('เขตที่ 1') ? 1
              : r.patrol.includes('เขต 2')||r.patrol.includes('เขตที่ 2') ? 2
              : r.patrol.includes('เขต 3')||r.patrol.includes('เขตที่ 3') ? 3
              : r.patrol.includes('ร้อยเวร')||r.patrol.includes('20') ? parseInt(r.zone)<=10?'r20':0 : 0;
    const zn = parseInt(r.zone);
    if ((grp===1||grp===2||grp===3) && zn>=1 && zn<=10) {
      todayByZone[grp][zn] = (todayByZone[grp][zn]||0) + 1;
    } else if (grp==='r20' && zn>=1 && zn<=10) {
      // ร้อยเวร 20 — นับเต็มทุกเขตที่มีโซนนั้น (ยึดพื้นที่ ไม่ใช่ตัวบุคคล)
      [1,2,3].forEach(g => {
        if (ZONE_NAMES[g][zn]) todayByZone[g][zn] = (todayByZone[g][zn]||0) + 1;
      });
    }
  });

  // ── ส่วนที่ 2: ย้อนหลัง 7 วัน จาก Sheet1 raw ──
  const now = new Date();
  const d7 = new Date(now); d7.setDate(d7.getDate()-7);
  const week = rows.filter(r => {
    const dt = parseRowDate(r.date, r.time);
    return dt && dt >= d7;
  });
  const weekByZone = {1:{},2:{},3:{}};
  week.forEach(r => {
    const grp = r.patrol.includes('เขต 1')||r.patrol.includes('เขตที่ 1') ? 1
              : r.patrol.includes('เขต 2')||r.patrol.includes('เขตที่ 2') ? 2
              : r.patrol.includes('เขต 3')||r.patrol.includes('เขตที่ 3') ? 3 : null;
    const isR20 = r.patrol.includes('ร้อยเวร')||r.patrol.includes('20');
    const zn = parseInt(r.zone);
    if (grp && zn>=1 && zn<=10) {
      weekByZone[grp][zn] = (weekByZone[grp][zn]||0) + 1;
    }
    if (isR20 && zn>=1 && zn<=10) {
      // ร้อยเวร 20 — นับเต็มทุกเขตที่มีโซนนั้น (ยึดพื้นที่ ไม่ใช่ตัวบุคคล)
      [1,2,3].forEach(g => {
        if (ZONE_NAMES[g] && ZONE_NAMES[g][zn]) {
          weekByZone[g][zn] = (weekByZone[g][zn]||0) + 1;
        }
      });
    }
  });

  const maxWeek = Math.max(...[1,2,3].flatMap(g=>Object.values(weekByZone[g])),1);

  // ── KPI ──
  const todayOk   = today.filter(r=>!r.status.includes('ผิดปกติ')).length;
  const todayWarn = today.filter(r=>r.status.includes('ผิดปกติ')).length;

  function zoneHeatRow(grp, zn, weekCnt, todayCnt) {
    const name = ZONE_NAMES[grp][zn];
    const pct  = Math.round(weekCnt/maxWeek*100);
    const heat = weekCnt===0 ? '#1e2840'
               : weekCnt<=2  ? '#1e3a5f'
               : weekCnt<=5  ? '#1d5490'
               : weekCnt<=10 ? '#2563b0'
               :                '#3b82f6';
    const todayMark = todayCnt > 0 ? `<span style="font-size:9px;color:#22d3a0;margin-left:4px">✓${todayCnt}</span>` : '';
    return `<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #1e2840">
      <div style="width:16px;text-align:right;font-size:10px;font-family:var(--mono);color:var(--muted);flex-shrink:0">${zn}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px">${name}${todayMark}</div>
        <div style="height:6px;background:#0b0e15;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${heat};border-radius:3px;transition:width .6s"></div>
        </div>
      </div>
      <div style="width:20px;text-align:right;font-family:var(--mono);font-size:10px;color:${weekCnt===0?'#4e6480':weekCnt>5?'#38bdf8':'var(--fg)'}">
        ${weekCnt===0?'—':weekCnt}
      </div>
    </div>`;
  }

  function zoneSection(grp, color) {
    const gname = grp===1?'เขต 1':grp===2?'เขต 2':'เขต 3';
    const zones = Object.keys(ZONE_NAMES[grp]).map(Number).sort((a,b)=>a-b);
    const missing = zones.filter(z=>(weekByZone[grp][z]||0)===0);
    return `<div style="background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:11px;font-weight:700;color:${color}">${gname}</div>
        ${missing.length ? `<div style="font-size:9px;color:var(--warn);background:rgba(240,82,82,.1);padding:2px 7px;border-radius:10px">⚠ ขาด ${missing.length} โซน</div>` : '<div style="font-size:9px;color:var(--ok);background:rgba(34,211,153,.1);padding:2px 7px;border-radius:10px">✓ ครบทุกโซน</div>'}
      </div>
      <div style="font-size:9px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between">
        <span>โซน · ชื่อสถานที่</span><span>7 วัน</span>
      </div>
      ${zones.map(zn => zoneHeatRow(grp, zn, weekByZone[grp][zn]||0, todayByZone[grp][zn]||0)).join('')}
    </div>`;
  }

  el.innerHTML = `
    <!-- ผลัดนี้ -->
    <div style="background:var(--surf);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:14px">
      <div style="font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:10px">⚡ ผลัดนี้ — real time</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px">
        <div style="background:var(--surf2);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:22px;font-weight:700;font-family:var(--mono);color:var(--accent)">${today.length}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">รายงาน</div>
        </div>
        <div style="background:var(--surf2);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:22px;font-weight:700;font-family:var(--mono);color:var(--ok)">${todayOk}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">ปกติ</div>
        </div>
        <div style="background:var(--surf2);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:22px;font-weight:700;font-family:var(--mono);color:${todayWarn>0?'var(--warn)':'var(--muted)'}">${todayWarn}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">ผิดปกติ</div>
        </div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${Object.entries(todayByPatrol).map(([k,v])=>`
          <div style="background:${pColors[k]||'#6b7280'}18;border:1px solid ${pColors[k]||'#6b7280'}44;border-radius:6px;padding:4px 8px;font-size:10px;color:${pColors[k]||'#6b7280'};font-family:var(--mono)">${k} · ${v}</div>
        `).join('')}
      </div>
    </div>

    <!-- heatmap ย้อนหลัง 7 วัน -->
    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:4px 0">
      🗓 ย้อนหลัง 7 วัน — coverage รายโซน
      <span style="font-weight:400;font-size:9px;margin-left:6px">✓= ผลัดนี้</span>
    </div>

    ${zoneSection(1,'#38bdf8')}
    ${zoneSection(2,'#c084fc')}
    ${zoneSection(3,'#22d3a0')}

    ${!n ? '' : `
    <!-- สรุปจาก Sheet2 -->
    <div style="background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:14px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:10px">📋 สรุปย้อนหลัง ${n} ผลัด</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
        <div style="background:var(--surf2);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;font-family:var(--mono);color:var(--accent)">${summaryRows.reduce((s,r)=>s+r.total,0)}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">รายงานสะสม</div>
        </div>
        <div style="background:var(--surf2);border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:20px;font-weight:700;font-family:var(--mono);color:var(--ok)">${Math.round(summaryRows.reduce((s,r)=>s+r.total,0)/n)}</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">เฉลี่ย/ผลัด</div>
        </div>
      </div>
    </div>`}
  `;
}
